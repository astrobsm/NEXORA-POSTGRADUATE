name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------------
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rtc
          POSTGRES_PASSWORD: rtc
          POSTGRES_DB: rtc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rtc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Pinned deliberately. An unpinned linter turns the build red when
          # ruff ships a new rule, not when this repository changes — which
          # trains everyone to ignore a red build. Bump it on purpose.
          pip install 'ruff==0.14.5'

      - name: Lint
        run: ruff check app tests

      - name: Format check
        run: ruff format --check app tests
        continue-on-error: true

      - name: Test (SQLite)
        run: pytest -q

      # The suite runs against SQLite for speed, but the schema and every query
      # must also work on PostgreSQL — which is what deployments actually use.
      - name: Test (PostgreSQL)
        env:
          RTC_DATABASE_URL: postgresql+psycopg://rtc:rtc@localhost:5432/rtc_test
          RTC_SECRET_KEY: ci-secret-key
        run: pytest -q

      - name: Migrations apply cleanly from empty
        env:
          RTC_DATABASE_URL: postgresql+psycopg://rtc:rtc@localhost:5432/rtc_migrations
          RTC_SECRET_KEY: ci-secret-key
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          admin = create_engine("postgresql+psycopg://rtc:rtc@localhost:5432/postgres",
                                isolation_level="AUTOCOMMIT")
          with admin.connect() as c:
              c.execute(text("DROP DATABASE IF EXISTS rtc_migrations"))
              c.execute(text("CREATE DATABASE rtc_migrations"))
          PY
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Migrations match the models
        env:
          RTC_DATABASE_URL: postgresql+psycopg://rtc:rtc@localhost:5432/rtc_migrations
          RTC_SECRET_KEY: ci-secret-key
        run: |
          # A model change without a migration is the single most common way a
          # deploy breaks; autogenerate must produce nothing.
          alembic check

      - name: Seed reference data
        env:
          RTC_DATABASE_URL: postgresql+psycopg://rtc:rtc@localhost:5432/rtc_test
          RTC_SECRET_KEY: ci-secret-key
        run: python -m app.db.seed --no-demo

      # The generation pipeline must be demonstrable with no API key. If this
      # ever needs one, the offline provider has stopped being a real seam and
      # the whole workflow becomes untestable in CI.
      - name: AI pipeline runs without a provider key
        env:
          RTC_SECRET_KEY: ci-secret-key
        run: |
          test -z "${RTC_AI_API_KEY:-}" || { echo "A key leaked into CI"; exit 1; }
          python - <<'EOF'
          from app.services.ai.provider import describe_provider, get_provider
          described = describe_provider(get_provider())
          assert described["is_offline_placeholder"], described
          assert "clinically meaningless" in described["warning"]
          print(f"Offline provider active: {described['model']}")
          EOF

  # ------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build

      - name: Check bundle budget
        run: |
          # A trainee on a hospital connection should not wait on a 2 MB bundle.
          BYTES=$(du -sb dist | cut -f1)
          LIMIT=$((6 * 1024 * 1024))
          echo "dist size: $((BYTES / 1024)) KiB (limit $((LIMIT / 1024)) KiB)"
          test "$BYTES" -lt "$LIMIT"

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ------------------------------------------------------------------------
  vercel-bundle:
    name: Vercel function bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the serverless dependency set
        run: pip install -r requirements.txt

      - name: The entrypoint must import and expose an ASGI app
        env:
          RTC_SECRET_KEY: ci-secret-key
        run: |
          python - <<'EOF'
          import importlib.util
          spec = importlib.util.spec_from_file_location("vercel_entry", "api/index.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          schema = module.app.openapi()
          print(f"{len(schema['paths'])} routes")
          assert schema["info"]["contact"]["name"] == "NEXORA Innovations"
          EOF

      - name: Serverless database strategy is correct
        env:
          RTC_SECRET_KEY: ci-secret-key
          VERCEL: '1'
          RTC_DATABASE_URL: postgresql+psycopg://u:p@db.pooler.supabase.com:6543/postgres
        run: |
          cd backend
          python - <<'EOF'
          from sqlalchemy.pool import NullPool
          from app.db.session import engine_kwargs
          kwargs = engine_kwargs()
          assert kwargs["poolclass"] is NullPool, "serverless must not pool in-process"
          assert kwargs["connect_args"]["prepare_threshold"] is None, (
              "PgBouncer transaction mode cannot serve prepared statements")
          print("Serverless strategy verified.")
          EOF

  # ------------------------------------------------------------------------
  containers:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, frontend, vercel-bundle]

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: rtc-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: rtc-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the stack
        run: |
          docker compose up -d --wait --wait-timeout 180
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/ | grep -q "Postgraduate Medical Training Console"
          docker compose down -v
        env:
          RTC_SECRET_KEY: ci-secret-key
