[project]
name = "nexora-postgraduate-console"
version = "1.0.0"
description = "Postgraduate Medical Training Console — offline-first competency-based medical education platform"
requires-python = ">=3.11"
license = { text = "Proprietary — © NEXORA Technologies" }
authors = [{ name = "NEXORA Technologies" }]

[project.urls]
Homepage = "https://github.com/astrobsm/NEXORA-POSTGRADUATE"
Documentation = "https://github.com/astrobsm/NEXORA-POSTGRADUATE/tree/main/docs"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "alembic/versions", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "B008",    # FastAPI's Depends()/Query() in defaults is the documented idiom
    "RUF012",  # ClassVar annotations are noise on SQLAlchemy declarative models
]

[tool.ruff.lint.per-file-ignores]
"app/db/seed.py" = ["C901"]        # the seeder is intentionally long and linear
"app/models/*.py" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q --tb=short"

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "E501", "W503"]
exclude = [".venv", "alembic/versions"]
