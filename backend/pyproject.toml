[project]
name = "nexora-postgraduate-console"
version = "1.0.0"
description = "Postgraduate Medical Training Console — offline-first competency-based medical education platform"
requires-python = ">=3.11"
license = { text = "Proprietary — © NEXORA Innovations" }
authors = [{ name = "NEXORA Innovations" }]

[project.urls]
Homepage = "https://github.com/astrobsm/NEXORA-POSTGRADUATE"
Documentation = "https://github.com/astrobsm/NEXORA-POSTGRADUATE/tree/main/docs"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "alembic/versions", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "B008",    # FastAPI's Depends()/Query() in defaults is the documented idiom
    "RUF012",  # ClassVar annotations are noise on SQLAlchemy declarative models
    # The "ambiguous unicode" family. This codebase deliberately uses en dashes
    # in prose, × in dimensions and ’ in contractions, because the strings are
    # read by clinicians in a user interface, not by a compiler. Replacing them
    # with ASCII would make the product worse to satisfy a linter.
    "RUF001",
    "RUF002",
    "RUF003",
    # Sequence concatenation. `a + [b]` is clearer than `[*a, b]` when the
    # intent is "this list plus one more", and the rule fires on every
    # permission-set definition in app/core/rbac.py.
    "RUF005",
]

[tool.ruff.lint.per-file-ignores]
"app/db/seed.py" = ["C901"]        # the seeder is intentionally long and linear
"app/models/*.py" = ["RUF012"]
# Tests unpack tuples for readability even when only one element is asserted on.
"tests/*.py" = ["RUF059"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q --tb=short"

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "E501", "W503"]
exclude = [".venv", "alembic/versions"]
