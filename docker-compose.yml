# --------------------------------------------------------------------------
# Residency Training Console — local / evaluation stack
#
#   docker compose up --build     → http://localhost:8080
#
# For production, see docs/DEPLOYMENT.md: use managed PostgreSQL and object
# storage, supply secrets from a secret manager rather than a .env file, and
# terminate TLS ahead of the web container.
# --------------------------------------------------------------------------

name: rtc

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rtc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rtc_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-rtc}
      # C collation keeps index behaviour predictable across host platforms.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --lc-collate=C --lc-ctype=C'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rtc} -d ${POSTGRES_DB:-rtc}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [rtc]

  minio:
    # S3-compatible object storage for logbook attachments, evidence uploads and
    # generated reports.
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-rtc_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-rtc_minio_password}
    volumes:
      - minio-data:/data
    ports:
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [rtc]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RTC_ENV: ${RTC_ENV:-development}
      RTC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rtc}:${POSTGRES_PASSWORD:-rtc_local_password}@postgres:5432/${POSTGRES_DB:-rtc}
      # CHANGE THIS. Sessions are signed with it; a shared default is a shared key.
      RTC_SECRET_KEY: ${RTC_SECRET_KEY:-change-me-before-any-real-deployment}
      RTC_CORS_ORIGINS: ${RTC_CORS_ORIGINS:-http://localhost:8080}
      RTC_RUN_MIGRATIONS: 'true'
      RTC_SEED_ON_START: ${RTC_SEED_ON_START:-true}
      RTC_ALLOW_DEMO_SEED: ${RTC_ALLOW_DEMO_SEED:-true}
      RTC_S3_ENDPOINT_URL: http://minio:9000
      RTC_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rtc_minio}
      RTC_S3_SECRET_KEY: ${S3_SECRET_KEY:-rtc_minio_password}
      RTC_S3_BUCKET: ${S3_BUCKET:-rtc-artifacts}
    networks: [rtc]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api/v1
        VITE_SHOW_DEMO_ACCOUNTS: ${SHOW_DEMO_ACCOUNTS:-true}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'
    networks: [rtc]

volumes:
  postgres-data:
  minio-data:

networks:
  rtc:
    driver: bridge
