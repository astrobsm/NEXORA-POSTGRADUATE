# --------------------------------------------------------------------------
# Serves the PWA shell and proxies the API, so the browser sees one origin.
# A single origin matters here: the service worker's cache scope, the cookie
# scope and the CORS surface all collapse to one, which is both simpler and
# safer than splitting them.
# --------------------------------------------------------------------------

upstream rtc_api {
    server api:8000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers ------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    # No inline scripts are emitted by the build, so the policy can stay tight.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/manifest+json image/svg+xml;

    # ---- API -------------------------------------------------------------
    location /api/ {
        proxy_pass         http://rtc_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        # Report generation and large sync pulls can be slow on a busy database.
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_buffering       off;
    }

    location = /health {
        proxy_pass       http://rtc_api/health;
        access_log       off;
        proxy_set_header Host $host;
    }

    # ---- Static assets ---------------------------------------------------
    # Content-hashed, so they are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # The service worker must never be cached, or a device can be pinned to an
    # old build indefinitely — a genuine problem when the fix is a data-safety one.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    # ---- SPA fallback ----------------------------------------------------
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
